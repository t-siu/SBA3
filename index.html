<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Fylo data storage component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body class="d-flex flex-column justify-content-center align-items-center min-vh-100 p-3">
  <main class="container">
    <div class="row g-4 align-items-md-end justify-content-center">

      <!-- Logo & Action Icons -->
      <div class="col-12 col-md-4">
        <div class="brand-logo p-4 rounded-3">
          <img src="./images/logo.svg" alt="Fylo logo" class="mb-4">

          <div class="d-flex gap-3">
            <button type="button" class="btn icon-btn p-2 rounded-3" aria-label="New document">
              <img src="./images/icon-document.svg" alt=" New document">
            </button>
            <button type="button" class="btn icon-btn p-2 rounded-3" aria-label="New folder">
              <img src="./images/icon-folder.svg" alt=" New folder">
            </button>
            <button type="button" class="btn icon-btn p-2 rounded-3" aria-label="Upload file">
              <img src="./images/icon-upload.svg" alt="Upload file">
            </button>
          </div>
        </div>
      </div>

      <!-- Storage Information -->
      <div class="col-12 col-md-8">
        <div class="storage-status p-4 rounded-3">
          <p class="mb-3">You've used <strong>815 GB</strong> of your storage</p>

          <!-- Amount of Storage left -->
          <div class="left-box bg-white text-dark px-4 py-2 rounded-3 mt-3 d-inline-block">
            <strong class="fs-2">185</strong>
            <span class="small fw-bold text-secondary">GB Left</span>
          </div>

          <div class="d-flex justify-content-between small fw-bold mb-3">
            <span>0 GB</span>
            <span>1000 GB</span>
          </div>
        </div>
      </div>
    </div>

  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Thai Siu</a>.
  </footer>
</body>

</html>
